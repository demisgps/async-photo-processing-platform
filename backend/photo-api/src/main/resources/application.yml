spring:
  application:
    name: photo-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate.naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 22MB
  lifecycle:
    timeout-per-shutdown-phase: 8s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${PORT:${SERVER_PORT:8080}}
photo:
  cloud-sql:
    connection-name: ${CLOUD_SQL_CONNECTION_NAME:}
    database-name: ${DB_NAME:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    original-bucket: ${ORIGINAL_BUCKET:}
    processed-bucket: ${PROCESSED_BUCKET:}
    project-id: ${GCP_PROJECT_ID:}
    connect-timeout: 2s
    rpc-timeout: 10s
    total-timeout: 20s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
    backoff-multiplier: 2.0
  upload:
    max-bytes: ${PHOTO_MAX_BYTES:10485760}
