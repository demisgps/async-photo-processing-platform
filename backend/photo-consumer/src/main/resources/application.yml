spring:
  application:
    name: photo-consumer
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/photo_platform}
    username: ${DB_USER:photo}
    password: ${DB_PASSWORD:photo-local}
  jpa:
    open-in-view: false
    hibernate.naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${PORT:${SERVER_PORT:8081}}
photo:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:4443}
    processed-bucket: ${PROCESSED_BUCKET:fotos-usuarios-processadas}
    project-id: ${GCP_PROJECT_ID:local-photo-platform}
    connect-timeout: 2s
    rpc-timeout: 10s
    total-timeout: 20s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
    backoff-multiplier: 2.0
# Micro-retry de Storage: até 3 tentativas por entrega. Macro-redelivery: subscription Pub/Sub,
# até 8 entregas best-effort (10s–300s). Ambos são finitos e dimensionados conjuntamente.
