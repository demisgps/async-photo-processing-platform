spring:
  application:
    name: photo-consumer
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/photo_platform}
    username: ${DB_USER:photo}
    password: ${DB_PASSWORD:photo-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${SERVER_PORT:8081}
photo:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:4443}
    processed-bucket: ${PROCESSED_BUCKET:fotos-usuarios-processadas}
  pubsub:
    project-id: ${PUBSUB_PROJECT_ID:local-photo-platform}
    subscription: ${PUBSUB_SUBSCRIPTION:photo-consumer-sub}
    dead-letter-subscription: ${PUBSUB_DLT_SUBSCRIPTION:photo-consumer-dlq-sub}

