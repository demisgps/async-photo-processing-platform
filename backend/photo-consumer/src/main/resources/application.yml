spring:
  application:
    name: photo-consumer
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate.naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${PORT:${SERVER_PORT:8081}}
photo:
  cloud-sql:
    connection-name: ${CLOUD_SQL_CONNECTION_NAME:}
    database-name: ${DB_NAME:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    processed-bucket: ${PROCESSED_BUCKET:fotos-usuarios-processadas}
    project-id: ${GCP_PROJECT_ID:}
    connect-timeout: 2s
    rpc-timeout: 10s
    total-timeout: 20s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
    backoff-multiplier: 2.0
# Micro-retry de Storage: até 3 tentativas por entrega. Macro-redelivery: subscription Pub/Sub,
# até 8 entregas best-effort (10s–300s). Ambos são finitos e dimensionados conjuntamente.
